[package]
name = "canon-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.103"
askama = "0.16.0"
minify-html = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toon-format = { version = "0.5.0", default-features = false }
unicode-normalization = "0.1.25"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
