
# Browser end-to-end tests for templates/app.js against the built page, run
# with Bun, with 100% line/branch/function coverage of app.js enforced and
# the test sources type-checked. Runs when the page's behavior or content
# changes; content edits are covered because the suite exercises the real
# committed index.html.
name: e2e

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "canon.toon"
      - "templates/**"
      - "e2e/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "index.html"
      - "canon.toon"
      - "templates/**"
      - "e2e/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Playwright's runner needs Node (its bin is node-shebang); ubuntu-latest
      # ships it. Bun drives install and the scripts.
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
