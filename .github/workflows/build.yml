
# Full source build + tests — manual only (Actions tab -> build -> Run
# workflow), so no push ever waits on a Rust compile. Day-to-day pushes are
# gated by check.yml, which runs the shipped bin/canon-builder in seconds.
# The binary cannot go stale silently: Askama compiles the templates into
# it, so a src/ or template change that isn't re-shipped makes the binary's
# output disagree with the committed index.html and check.yml goes red.
# Run this workflow after builder changes for the full test suite, or run
# `cargo test` locally.
name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo test --release
      - run: cargo run --release -- --check
      - name: shipped binary is fresh
        run: ./bin/canon-builder --check
